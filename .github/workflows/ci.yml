# ABOUTME: CI for the inkflow subdirectory -- builds rsvp-core and the host tools,
# ABOUTME: then runs the ctest suite. Device firmware needs PlatformIO and is not built.

name: inkflow CI

# inkflow is one subdirectory of a dotfiles repo, so the path filter keeps unrelated
# dotfiles commits from spending runner minutes on a C++ build.
on:
  push:
    paths:
      - 'inkflow/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'inkflow/**'
      - '.github/workflows/ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkflow

    steps:
      - uses: actions/checkout@v4

      # The simulator links -lz for PNG output. Installed unconditionally so the job
      # is already correct on the commit that first makes sim a cmake target.
      - name: Install zlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      # rsvp-core's "usable on bare metal" claim is enforced by compiling the same
      # sources with -fno-exceptions -fno-rtti, not asserted in prose. Naming the
      # target here means deleting it fails CI instead of passing quietly.
      - name: Check freestanding target builds
        run: cmake --build build --target rsvp_core_freestanding

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The firmware is the one part of the tree that no test exercises and, until this job
  # existed, no machine but the author's laptop ever compiled. transfer.h alone is 167
  # lines of WiFi, HTTP and streaming upload with zero coverage. A type check on every
  # push is not a test, but it is the difference between unverified and unverifiable.
  #
  # Ubuntu runners are x86_64, so espressif32's RISC-V toolchain is native here. On Apple
  # silicon it needs Rosetta -- see docs/STATUS.md.
  firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build the reader firmware
        run: pio run -d inkflow/firmware/reader

      - name: Build the measurement firmware
        run: pio run -d inkflow/bench/eink-bench
