; ABOUTME: Build for eink-bench, the on-device SSD1677 refresh and power measurement
; ABOUTME: harness. Flashes to app0 only, leaving bootloader and partition table alone.

[env:xteink-x4]
; Pinned. Unpinned, "the firmware compiles and links" is a claim about whatever the
; registry served that morning, and README.md makes that claim in the present tense.
; 7.1.3 is the release that built the image with hardware evidence behind it.
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; app0 only -- never touch the bootloader or partition table
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    zinggjm/GxEPD2@^1.5.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_TASK_WDT_INIT=0
    -I../include
