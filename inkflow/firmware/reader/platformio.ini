; ABOUTME: Build for the inkflow RSVP reader firmware. Flashes to app0 only, leaving
; ABOUTME: the bootloader and partition table untouched.

[env:xteink-x4]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    zinggjm/GxEPD2@^1.5.9
    InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor

; rsvp-core is C++17; the Arduino-ESP32 default is gnu++11, under which a constexpr
; function must be a single return statement and the engine will not compile.
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_TASK_WDT_INIT=0
    -I../../core/include

build_src_filter = +<*> +<../../../core/src/*.cpp>
