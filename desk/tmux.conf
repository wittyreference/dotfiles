# ABOUTME: tmux for a keyboard-only desk running Claude Code: bell flags, true colour, passthrough, palette.
# ABOUTME: Installed to ~/.tmux.conf by desk/install.sh; every option below exists in tmux 3.3a.

# Claude Code under tmux (code.claude.com/docs/en/terminal-config): passthrough + extended keys.
# Passthrough lets notifications reach the outer terminal; extended keys let Shift+Enter
# differ from Enter, which needs an outer terminal that speaks the kitty keyboard protocol.
set -g default-terminal tmux-256color
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# True colour: without this the hex palette below is quantised to 256 colours.
set -as terminal-features 'xterm*:RGB'
# A BEL from Claude (preferredNotifChannel=terminal_bell) lights that window's tab and a status message.
# monitor-bell / bell-action are 3.3a defaults, pinned here so a future tmux cannot change them.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell on
# Size to the client that last touched a window: a phone or SSH client never shrinks the monitor's view.
set -g window-size latest
# Key latency, app focus events (lets Claude see when you leave the pane), mouse stays on.
set -s escape-time 10
set -g focus-events on
set -g mouse on
# Enough history that Ctrl+O then [ (transcript into scrollback) is not cut at 2000 lines. New panes only.
set -g history-limit 20000
# Windows name themselves after their directory, so a worktree window reads as its worktree.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
# The desk palette. Format variables only: no shell runs per refresh.
set -g status-style 'bg=#0C1810,fg=#7DFFA9'
set -g window-status-current-style 'fg=#00FF41,bold'
set -g window-status-bell-style 'bg=#00FF41,fg=#000000,bold'
set -g pane-active-border-style 'fg=#00FF41'
set -g pane-border-style 'fg=#0C1810'
set -g message-style 'bg=#00FF41,fg=#000000'
