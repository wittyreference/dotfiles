# Desk palette: a card in the corner for eight seconds, not a red flash over the transcript.
# Critical urgency keeps the red so a real alarm still reads as one.
default-timeout=8000
anchor=bottom-right
margin=24
padding=12
border-size=2
border-radius=6
background-color=#0C1810F0
border-color=#00FF41
text-color=#7DFFA9
font=Quicksand Medium 14
max-visible=3

[urgency=critical]
background-color=#CC0000F0
border-color=#FFFFFF
text-color=#FFFFFF
